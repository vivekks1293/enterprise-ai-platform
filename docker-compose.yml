services:

  # ==========================================
  # 1. PostgreSQL 16 Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: enterprise-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: enterprise_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - enterprise-net

  # ==========================================
  # 2. FastAPI Backend Application
  # ==========================================
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: enterprise-ai-backend
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/enterprise_ai
      ALEMBIC_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/enterprise_ai
    volumes:
      - knowledge_data:/app/data/knowledge
      - chroma_data:/app/data/chroma
      - bm25_data:/app/data/bm25
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3.5G
    networks:
      - enterprise-net

  # ==========================================
  # 3. Modern Angular 18 UI & Nginx Gateway
  # ==========================================
  frontend:
    build:
      context: ./apps/ui
      dockerfile: Dockerfile
    container_name: enterprise-ai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - enterprise-net

  # ==========================================
  # 4. Cloudflare Secure Public Tunnel
  # ==========================================
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: enterprise-ai-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend
    networks:
      - enterprise-net

networks:
  enterprise-net:
    driver: bridge

volumes:
  postgres_data:
  knowledge_data:
  chroma_data:
  bm25_data:

